<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
    <title>Lueur</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #1b2b34;
        overflow: hidden;
      }
      #jeu {
        width: 100%;
        height: 100%;
        display: grid;
        place-items: center;
      }
      canvas {
        image-rendering: pixelated;
        touch-action: none;
      }
    </style>
  </head>
  <body>
    <div id="jeu"></div>
    <script>
      // Après un déploiement, un navigateur peut encore avoir cette page en
      // cache alors qu'elle réclame un fichier de jeu qui n'existe plus : la
      // page reste noire, sans message. On recharge alors une seule fois en
      // contournant le cache. Le drapeau en session empêche toute boucle.
      window.addEventListener(
        'error',
        function (evenement) {
          if (!(evenement.target instanceof HTMLScriptElement)) return;
          try {
            if (sessionStorage.getItem('rechargement-cache')) return;
            sessionStorage.setItem('rechargement-cache', '1');
          } catch (e) {
            // Stockage indisponible (navigation privée) : on recharge quand même,
            // au pire une fois de trop.
          }
          location.replace(location.pathname + '?r=' + Date.now());
        },
        true,
      );
    </script>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
